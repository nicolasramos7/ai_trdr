name: Trading agent

# 4 sessions per trading day. Timezone-aware (GitHub added `timezone:` in March
# 2026) — handles EDT/EST automatically, so no manual UTC shifting in winter.
#
# Sizing: GitHub's scheduler is best effort. Observed delivery is ~1 run/hour
# with the rest silently dropped, each arriving 20-40 min late. Asking for more
# than ~1/hour buys nothing, and every extra session is another independent
# chance for a stateless agent to churn a position — on fractional MARKET
# orders the bid/ask spread is the dominant cost, since Alpaca charges no
# commission. Fewer, better-placed sessions beat more of them.
#
# Placement: each slot is chosen so the whole delivery window [T, T+40min] is
# tradeable, not just T.
#   9:50  -> 9:50-10:30  overnight and pre-market news digested, opening
#                        spreads settled; never fires before the 9:30 open.
#   11:20 -> 11:20-12:00 late morning, still liquid.
#   13:35 -> 13:35-14:15 afternoon, after the midday lull. The long 11:20->13:35
#                        gap deliberately skips ~12:00-13:30, the thinnest
#                        liquidity and widest spreads of the session.
#   14:55 -> 14:55-15:35 last look before the ~19h overnight hole, with buffer
#                        to stay clear of closing-auction imbalance and to
#                        never land after the 16:00 close on a worst-case delay.
# Slots are >=80 min apart to stay under the ~1/hour delivery throttle, and off
# :00/:15/:30 to avoid GitHub's own cron congestion.
on:
  schedule:
    - cron: "50 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "20 11 * * 1-5"
      timezone: "America/New_York"
    - cron: "35 13 * * 1-5"
      timezone: "America/New_York"
    - cron: "55 14 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

# Least privilege: the agent keeps no local state (portfolio lives in Alpaca and
# each session is stateless), so the workflow never writes back to the repo.
permissions:
  contents: read

# Don't let a delayed run overlap the next scheduled one; let the in-flight
# session finish rather than cancelling it mid-order.
concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  run-trading-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run trading agent (single session)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Optional overrides — safe to leave unset; the agent falls back to its
          # defaults (paper endpoint, gemini-2.5-flash, profile "gemini").
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: npm start

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: ignore
