name: Trading agent

# 13 sessions per trading day, every ~30 min, 9:41–15:41 ET.
# Timezone-aware (GitHub added `timezone:` in March 2026) — handles EDT/EST
# automatically, so no more manual UTC shifting in winter.
# Odd minutes (:11, :41) avoid GitHub's :00/:15/:30 cron congestion.
on:
  schedule:
    - cron: "41 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "11,41 10-15 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

# Least privilege: the agent keeps no local state (portfolio lives in Alpaca and
# each session is stateless), so the workflow never writes back to the repo.
permissions:
  contents: read

# Don't let a delayed run overlap the next scheduled one; let the in-flight
# session finish rather than cancelling it mid-order.
concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  run-trading-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run trading agent (single session)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Optional overrides — safe to leave unset; the agent falls back to its
          # defaults (paper endpoint, gemini-2.5-flash, profile "gemini").
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
        run: npm start

      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: ignore
